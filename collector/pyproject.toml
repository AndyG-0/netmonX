[project]
name = "netmon-collector"
version = "0.1.0"
description = "Read-only SSH collector for stock Asuswrt routers, exposing Prometheus metrics"
requires-python = ">=3.12"
dependencies = [
    "asyncssh==2.24.1",
    # On ARM VMs that misreport CPU features this needs OPENSSL_armcap=0 (set in the Dockerfile).
    "cryptography==50.0.0",
    "prometheus-client==0.26.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "watchfiles==1.3.0"]

[project.scripts]
netmon-collector = "netmon_collector.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["netmon_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
