global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Recording rules (ISP report card).
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: asus
    static_configs:
      - targets: ["asus-collector:9877"]

  # LAN-side pings. Edit targets in config/smokeping/config.yml.
  - job_name: smokeping
    static_configs:
      - targets: ["smokeping:9374"]

  # DNS lookup time. Targets are DNS servers; the query name is set in blackbox.yml.
  - job_name: dns
    metrics_path: /probe
    params:
      module: [dns_lookup]
    # The router's own DNS (dnsmasq) comes from the collector, so its IP follows ROUTER_HOST.
    http_sd_configs:
      - url: http://asus-collector:9877/sd/dns
    static_configs:
      - targets: ["1.1.1.1:53"]
        labels: { resolver: cloudflare }
      - targets: ["8.8.8.8:53"]
        labels: { resolver: google }
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Router, AiMesh nodes and the ISP gateway, as the collector finds them (blackbox ICMP).
  - job_name: lan_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    http_sd_configs:
      - url: http://asus-collector:9877/sd/nodes
    relabel_configs: *blackbox_relabel

  # Every online LAN device. The list stays empty unless LAN_CLIENT_PING=true in .env.
  - job_name: lan_clients
    scrape_interval: 60s
    scrape_timeout: 5s
    metrics_path: /probe
    params:
      module: [icmp]
    http_sd_configs:
      - url: http://asus-collector:9877/sd/clients
        refresh_interval: 5m
    relabel_configs: *blackbox_relabel

  # Website reachability and response time.
  - job_name: http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://www.google.com
          - https://www.cloudflare.com
          - https://www.netflix.com
    relabel_configs: *blackbox_relabel

  # Turn on in Speedtest Tracker: Settings → Data Integration → Prometheus.
  - job_name: speedtest
    scrape_interval: 60s
    metrics_path: /prometheus
    static_configs:
      - targets: ["speedtest-tracker:80"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
