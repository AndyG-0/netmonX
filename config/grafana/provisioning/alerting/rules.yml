apiVersion: 1
groups:
  - orgId: 1
    name: netmonx
    folder: netmonX
    interval: 1m
    rules:
      - uid: router-unreachable
        title: Router or mesh node not answering SSH
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'min by (node) (asus_up)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $$labels.node }} has failed polls for 2 minutes (or the collector is down)."
      - uid: wan-down
        title: WAN down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max(asus_wan_up)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "The router reports the internet connection as down (every WAN, with dual WAN)."
      - uid: packet-loss
        title: Internet packet loss above 2%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'min(avg_over_time(asus_ping_loss_ratio{role="internet"}[5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.02] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Every internet ping target from the router has lost more than 2% of pings for 5+ minutes."
      - uid: latency-high
        title: Internet latency over 2x normal
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'min(avg_over_time(asus_ping_rtt_avg_ms{role="internet"}[10m]) / avg_over_time(asus_ping_rtt_avg_ms{role="internet"}[1d] offset 10m))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Router-side latency to every internet target is more than double its 24-hour average."
      - uid: lan-host-unreachable
        title: LAN host not answering pings
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '1 - sum by (host) (rate(smokeping_response_duration_seconds_count{host=~"(10|192\\.168|172\\.(1[6-9]|2[0-9]|3[01]))\\..*"}[2m])) / sum by (host) (rate(smokeping_requests_total{host=~"(10|192\\.168|172\\.(1[6-9]|2[0-9]|3[01]))\\..*"}[2m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $$labels.host }} (router or mesh node) stopped answering pings from the Docker host."
      - uid: speedtest-slow
        title: Speed test under half of normal
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'last_over_time(speedtest_tracker_download_bits[3h]) / quantile_over_time(0.5, speedtest_tracker_download_bits[7d])'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.5] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "The latest download speed test is below half of the 7-day median."
      - uid: node-rebooted
        title: Router or mesh node rebooted
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (node) (resets(asus_router_uptime_seconds[10m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $$labels.node }} rebooted in the last 10 minutes (its uptime went down)."
      - uid: temperature-high
        title: Router temperature above 85 °C
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (node, sensor) (asus_router_temperature_celsius)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [85] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $$labels.node }} sensor {{ $$labels.sensor }} has been above 85 °C for 10 minutes. Check ventilation (some models report radio temperatures on a different scale)."
      - uid: conntrack-high
        title: Connection table over 80% full
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (node) (asus_router_conntrack_entries / asus_router_conntrack_max)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $$labels.node }} is tracking more than 80% of its connection limit. New connections fail when it is full."
      - uid: memory-low
        title: Router memory below 10%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'min by (node) (asus_router_memory_available_bytes / asus_router_memory_total_bytes)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [0.1] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $$labels.node }} has had less than 10% of its RAM available for 10 minutes."
      - uid: wan-ip-changed
        title: WAN IP address changed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(increase(asus_wan_ip_changes[10m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
        annotations:
          summary: "The router got a new public IP address. Port forwards and dynamic DNS may need a moment to catch up."
      - uid: dhcp-pool-full
        title: DHCP pool almost full
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (node) (asus_dhcp_leases / asus_dhcp_pool_size)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "More than 90% of the DHCP pool is leased. New devices may not get an address."
      - uid: collector-stale
        title: Collector data stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'time() - max by (loop) (asus_last_poll_timestamp_seconds{node=~".+"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [300] }
        for: 0s
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "The collector has not finished a {{ $$labels.loop }} poll in over 5 minutes (or Prometheus cannot scrape it)."
      - uid: new-device
        title: New device on the network
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (mac, hostname) (asus_client_new)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
        annotations:
          summary: "A device the collector has never seen joined: {{ $$labels.mac }} {{ $$labels.hostname }}."
      - uid: known-device-offline
        title: Known device offline
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '(time() - max by (mac, hostname) (asus_client_last_seen_timestamp_seconds)) / 3600 - on (mac) group_left max by (mac) (asus_device_offline_alert_hours)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $$labels.hostname }} ({{ $$labels.mac }}) has been offline longer than its alert_offline_hours in devices.yml."
      - uid: wan-failover
        title: Primary WAN down, running on the second WAN
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'min(asus_wan_up{wan="0"}) + 0 * max(asus_wan_up{wan="1"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Dual WAN: the primary WAN is down. Traffic uses the second WAN if it is up."
      - uid: firmware-update
        title: Firmware update available
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (node, latest) (asus_firmware_update_available)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
        annotations:
          summary: "{{ $$labels.node }}: the router found newer firmware ({{ $$labels.latest }}). Update it from the Asus app or web UI."
      - uid: admin-open-to-internet
        title: Router admin open to the internet
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (node, setting) (asus_exposure_enabled{setting=~"ssh_wan|webui_wan"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $$labels.node }}: {{ $$labels.setting }} is on, so the router's admin login can be reached from the internet. Turn it off unless you need it."
      - uid: port-forwards-changed
        title: Port forwards or UPnP mappings changed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum by (node) (changes(asus_port_forwards[15m]) + changes(asus_upnp_mappings[15m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
        annotations:
          summary: "{{ $$labels.node }}: the number of open ports changed (port forwarding or UPnP). Check the Security & VPN row on the Router dashboard."
      - uid: config-changed
        title: Router settings changed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum by (node) (increase(asus_config_changes_total[15m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
        annotations:
          summary: "{{ $$labels.node }}: the router's settings changed. If that wasn't you (or a firmware update), check the web UI."
      - uid: login-failures
        title: Failed logins to the router
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum by (node) (increase(asus_syslog_events_total{event=~"ssh_login_failed|web_login_failed|vpn_login_failed"}[15m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $$labels.node }}: more than 2 failed SSH, web or VPN logins in 15 minutes. Someone may be guessing the password; see Router events on the Router dashboard."
      - uid: out-of-memory
        title: Router ran out of memory
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum by (node) (increase(asus_syslog_events_total{event=~"out_of_memory|crash"}[15m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $$labels.node }}: the router log shows a process killed for lack of memory or a crash. Frequent ones mean the router needs a reboot or a firmware update."
